services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: zilqa-api

    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      HOST: 0.0.0.0
      PORT: 8000